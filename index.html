<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIGNAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGNAL">
<meta name="theme-color" content="#0b0f18">
<meta name="description" content="SIGNAL — climb abandoned communications towers and restore the network. A first-person climbing game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<!-- build:stamp -->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f18; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #gl { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  /* no double-tap zoom on menus and buttons; panels may still pan/scroll */
  #ui, #ui * { touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<noscript><div style="color:#dfe6f0;padding:2rem;font-family:system-ui">SIGNAL needs JavaScript and WebGL.</div></noscript>
<script type="module" src="signal.js"></script>
<script>
  // iOS Safari ignores user-scalable=no in the browser: block double-tap and pinch zoom by hand.
  (function () {
    var last = 0;
    document.addEventListener('touchend', function (e) { var now = Date.now(); if (now - last < 320) e.preventDefault(); last = now; }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  })();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
