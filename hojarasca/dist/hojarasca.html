<script>
/* Hojarasca — 10_art.js  Procedural pixel art: autumn tiles, house, greenhouse, trees, props, leaves, player, icons. */
(function () {
  'use strict';
  const H = window.Hojarasca;
  const Col = H.color, T = H.TILE;
  function sprite(w, h, fn) {
    const cv = H.canvas(w, h), g = H.ctx2d(cv);
    const P = { w, h, g, cv,
      px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); },
      rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); },
      hline(x, y, w, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, 1); },
      vline(x, y, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, h | 0); },
      disc(cx, cy, r, c) { g.fillStyle = c; for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) { const dx = x + 0.5 - cx, dy = y + 0.5 - cy; if (dx * dx + dy * dy <= r * r) g.fillRect(x, y, 1, 1); } },
      ellipse(cx, cy, rx, ry, c) { g.fillStyle = c; for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1); } },
      tri(cx, top, w, h, c) { g.fillStyle = c; for (let y = 0; y < h; y++) { const ww = Math.round((y / h) * w); g.fillRect(Math.round(cx - ww / 2), top + y, Math.max(1, ww), 1); } },
      line(x0, y0, x1, y1, c) { g.fillStyle = c; x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy; for (;;) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } } },
      blit(img, x, y) { g.drawImage(img, x | 0, y | 0); } };
    fn(P, g); return cv;
  }
  H.sprite = sprite;
  const A = (H.art = {});
  const cache = new Map(); const memo = (k, fn) => { if (!cache.has(k)) cache.set(k, fn()); return cache.get(k); }; A.memo = memo;

  // ---- ground tiles -----------------------------------------------------------------------------
  A.tiles = () => memo('tiles', () => {
    const t = {};
    t.grass = [0, 1, 2, 3].map((v) => sprite(T, T, (P) => { const r = H.rng(100 + v); P.rect(0, 0, T, T, '#7a9a48'); for (let i = 0; i < 24; i++) P.px(r.int(T), r.int(T), r.chance(0.5) ? '#88a850' : '#6e8c40'); for (let i = 0; i < 4 + v; i++) { const x = r.int(T), y = r.int(T - 2); P.vline(x, y, 2, '#5e7c36'); } if (v === 3) P.px(r.int(T), r.int(T), '#c8b060'); }));
    t.path = sprite(T, T, (P) => { const r = H.rng(200); P.rect(0, 0, T, T, '#b8a888'); P.rect(1, 1, 6, 6, '#c8b898'); P.rect(9, 1, 6, 6, '#c0b090'); P.rect(1, 9, 6, 6, '#c0b090'); P.rect(9, 9, 6, 6, '#c8b898'); for (let i = 0; i < 6; i++) P.px(r.int(T), r.int(T), '#a89878'); });
    t.concrete = sprite(T, T, (P) => { const r = H.rng(300); P.rect(0, 0, T, T, '#a8a49c'); for (let i = 0; i < 14; i++) P.px(r.int(T), r.int(T), '#9c9890'); P.hline(0, 0, T, '#948f86'); P.vline(0, 0, T, '#948f86'); });
    t.water = [0, 1, 2, 3].map((f) => sprite(T, T, (P) => { P.rect(0, 0, T, T, '#4aa0c8'); const r = H.rng(400); for (let i = 0; i < 5; i++) { const x = (r.int(T) + f * 2) % T, y = (r.int(T) + f) % T; P.hline(x, y, 3, '#7ac0e0'); P.px(x + 1, y, '#a8dcf0'); } }));
    t.deck = sprite(T, T, (P) => { P.rect(0, 0, T, T, '#b08a5a'); for (let y = 0; y < T; y += 4) P.hline(0, y, T, '#8e6c42'); P.px(3, 2, '#7a5a34'); P.px(11, 10, '#7a5a34'); });
    t.glass = sprite(T, T, (P) => { P.rect(0, 0, T, T, '#bfe0d8'); P.rect(1, 1, 14, 14, '#cfeae2'); P.hline(0, 0, T, '#8ab0a8'); P.vline(0, 0, T, '#8ab0a8'); P.px(3, 3, '#e8f8f4'); });
    t.stone = sprite(T, T, (P) => { const r = H.rng(600); P.rect(0, 0, T, T, '#5a5a62'); P.hline(0, 7, T, '#46464e'); P.vline(7, 0, 8, '#46464e'); P.vline(3, 8, 8, '#46464e'); P.vline(12, 8, 8, '#46464e'); for (let i = 0; i < 5; i++) P.px(r.int(T), r.int(T), '#66666e'); });
    t.soil = sprite(T, T, (P) => { const r = H.rng(700); P.rect(0, 0, T, T, '#6a4a30'); for (let i = 0; i < 10; i++) P.px(r.int(T), r.int(T), '#7a5a3a'); for (let i = 0; i < 3; i++) { const x = 2 + r.int(12); P.vline(x, 6 + r.int(4), 4, '#4a8a3a'); P.px(x - 1, 6 + r.int(3), '#6ab04a'); } });
    t.sand = sprite(T, T, (P) => { const r = H.rng(800); P.rect(0, 0, T, T, '#e0cc90'); for (let i = 0; i < 12; i++) P.px(r.int(T), r.int(T), '#d0bc80'); });
    t.road = sprite(T, T, (P) => { const r = H.rng(900); P.rect(0, 0, T, T, '#4a4a50'); for (let i = 0; i < 8; i++) P.px(r.int(T), r.int(T), '#54545a'); });
    t.sidewalk = sprite(T, T, (P) => { P.rect(0, 0, T, T, '#bab6ae'); P.hline(0, 0, T, '#a4a098'); P.vline(0, 0, T, '#a4a098'); });
    t.porch = sprite(T, T, (P) => { P.rect(0, 0, T, T, '#c09a68'); for (let x = 0; x < T; x += 4) P.vline(x, 0, T, '#a07c50'); });
    t.void = sprite(T, T, (P) => { P.rect(0, 0, T, T, '#1a1410'); });
    t.rug = sprite(T, T, (P) => { P.rect(0, 0, T, T, '#8a3a3a'); P.rect(2, 2, 12, 12, '#a84a4a'); P.rect(4, 4, 8, 8, '#8a3a3a'); });
    return t;
  });

  // ---- leaves ---------------------------------------------------------------------------------------
  A.LEAF_COLORS = [['#d8502a', '#f07a40'], ['#e08a30', '#f0aa50'], ['#d8b040', '#f0d060'], ['#8a5a2a', '#a8743a'], ['#e8c040', '#fff0a0']]; // red, orange, yellow, brown, golden
  A.leaf = (type, frame) => memo('leaf' + type + frame, () => sprite(5, 5, (P) => {
    const [a, b] = A.LEAF_COLORS[type];
    if (frame === 0) { P.rect(1, 1, 3, 3, a); P.px(2, 1, b); P.px(1, 4, Col.shade(a, 0.8)); }
    else if (frame === 1) { P.rect(0, 2, 5, 1, a); P.rect(1, 1, 3, 3, a); P.px(3, 1, b); P.px(0, 2, Col.shade(a, 0.8)); }
    else if (frame === 2) { P.rect(2, 0, 1, 5, a); P.rect(1, 1, 3, 3, a); P.px(1, 3, b); P.px(2, 0, Col.shade(a, 0.8)); }
    else { P.px(1, 1, a); P.px(2, 2, a); P.px(3, 3, a); P.px(3, 1, a); P.px(1, 3, a); P.px(2, 1, b); P.px(2, 3, a); P.px(1, 2, a); P.px(3, 2, a); }
  }));

  // ---- trees, bushes --------------------------------------------------------------------------------
  A.tree = (kind, seed) => memo('tree' + kind + seed, () => sprite(40, 48, (P) => {
    const r = H.rng(seed * 17 + 3);
    const trunk = kind === 'birch' ? '#e6e2d6' : '#6b4a2b', trunkD = kind === 'birch' ? '#9a968a' : '#4e3620';
    P.rect(18, 30, 4, 18, trunk); P.vline(18, 30, 18, trunkD); if (kind === 'birch') for (let y = 32; y < 46; y += 4) P.rect(19 + r.int(2), y, 2, 1, '#3a3a3a');
    if (kind === 'pine') { const c1 = '#2f6e3a', c2 = '#3f8a4a'; for (let i = 0; i < 5; i++) { const y = 6 + i * 6, w = 8 + i * 5; P.tri(20, y, w, 10, i % 2 ? c1 : c2); } P.tri(20, 2, 4, 6, c2); return; }
    const pal = kind === 'maple' ? ['#d0602a', '#e88a3a', '#b84a2a'] : kind === 'oak' ? ['#c8862a', '#e0a840', '#a86a20'] : ['#d8b040', '#f0d060', '#b89030'];
    const blobs = [[20, 18, 15, 12], [12 + r.int(4), 22, 9, 7], [26 + r.int(4), 21, 9, 7], [20, 10 + r.int(3), 10, 7]];
    blobs.forEach((b, i) => P.ellipse(b[0], b[1], b[2], b[3], pal[i % 2 ? 1 : 0]));
    P.ellipse(16, 15, 6, 4, pal[2]);
    for (let i = 0; i < 16; i++) P.px(6 + r.int(28), 8 + r.int(20), pal[2]);
    for (let i = 0; i < 12; i++) P.px(6 + r.int(28), 6 + r.int(18), Col.lighten(pal[1], 0.2));
    // bare patches: autumn thinning
    for (let i = 0; i < 6; i++) { const x = 8 + r.int(24), y = 8 + r.int(18); P.px(x, y, trunkD); }
  }));
  A.bush = (seed) => memo('bush' + seed, () => sprite(16, 16, (P) => { const r = H.rng(seed); P.ellipse(8, 10, 7, 5, '#4f7a3a'); P.ellipse(6, 9, 4, 3, '#6a9a4a'); P.px(10, 7, '#3a6a2a'); for (let i = 0; i < 3; i++) P.px(3 + r.int(10), 7 + r.int(6), '#e08a30'); }));
  A.hedge = () => memo('hedge', () => sprite(16, 20, (P) => { P.rect(1, 4, 14, 16, '#3f6e30'); P.rect(1, 4, 14, 2, '#5a8a44'); for (let i = 0; i < 12; i++) P.px(2 + H.hash(i, 1, 4) * 12 | 0, 6 + H.hash(i, 2, 4) * 12 | 0, '#4f7e38'); P.rect(1, 19, 14, 1, '#2e5222'); }));

  // ---- buildings ------------------------------------------------------------------------------------
  A.house = () => memo('house', () => sprite(16 * T, 15 * T, (P) => {
    const wall = '#f0e4c8', wallD = '#d8c8a4', roof = '#8a4a3a', roofD = '#6a3628', roofL = '#a45a48', wood = '#6a4a2a', win = '#8ac0e0';

<script>
/* Hojarasca — 40_leaves.js  Leaf particle simulation in flat typed arrays. */
(function () {
  'use strict';
  const H = window.Hojarasca;
  const T = H.TILE, W = H.world, A = H.art;
  const LV = (H.leaves = {});
  const MAX = 6400;
  const X = new Float32Array(MAX), Y = new Float32Array(MAX), VX = new Float32Array(MAX), VY = new Float32Array(MAX), ROT = new Float32Array(MAX);
  const TYPE = new Uint8Array(MAX), ZONE = new Int8Array(MAX), ALIVE = new Uint8Array(MAX), FLY = new Uint8Array(MAX);
  LV.X = X; LV.Y = Y; LV.VX = VX; LV.VY = VY; LV.TYPE = TYPE; LV.ZONE = ZONE; LV.ALIVE = ALIVE;
  LV.n = 0; LV.onCollect = null; LV.blownCount = 0;
  LV.clear = () => { LV.n = 0; ALIVE.fill(0); };
  LV.add = (x, y, type, zone) => { if (LV.n >= MAX) return -1; const i = LV.n++; X[i] = x; Y[i] = y; VX[i] = 0; VY[i] = 0; ROT[i] = Math.random() * 4; TYPE[i] = type; ZONE[i] = zone; ALIVE[i] = 1; FLY[i] = 0; return i; };
  LV.spawnZone = function (zi, rng) {
    const z = W.ZONES[zi]; let placed = 0, tries = 0;
    const trees = W.trees.filter((t) => W.zoneAt(t.tx, t.ty + 1) === zi || W.zoneAt(t.tx - 2, t.ty + 2) === zi);
    while (placed < z.leaves && tries++ < z.leaves * 30) {
      let tx, ty;
      if (trees.length && rng.chance(0.55)) { const t = rng.pick(trees); tx = Math.round(t.tx + rng.gauss() * 2.2); ty = Math.round(t.ty + 1 + Math.abs(rng.gauss()) * 1.8); }
      else { const r = rng.pick(z.rects); tx = r[0] + rng.int(r[2] - r[0] + 1); ty = r[1] + rng.int(r[3] - r[1] + 1); }
      if (W.zoneAt(tx, ty) !== zi || !W.leafSpawnable(tx, ty)) continue;
      LV.add(tx * T + rng() * T, ty * T + rng() * T, rng.pick(z.types), zi); placed++;
    }
  };
  LV.countAlive = function (zi) { let n = 0; for (let i = 0; i < LV.n; i++) if (ALIVE[i] && (zi === undefined || ZONE[i] === zi)) n++; return n; };
  LV.collect = function (i, how) { if (!ALIVE[i]) return; ALIVE[i] = 0; if (LV.onCollect) LV.onCollect(i, how); };

  // ctx: {px,py, tool, aim, active, mvx, mvy, blower:{power,range,cone}, rake:{w}, vents:[{x,y,r}], bins:[{x,y,r}], wind:{x,y}}
  LV.update = function (dt, c) {
    const fr = Math.pow(0.82, dt * 60), frW = Math.pow(0.95, dt * 60);
    const blow = c.tool === 'blower' && c.active && c.blower.power > 0;
    const rake = c.tool === 'rake' && c.active && c.rake.w > 0;
    const cosA = Math.cos(c.aim), sinA = Math.sin(c.aim);
    const range = c.blower.range, halfCone = c.blower.cone / 2, power = c.blower.power;
    const rw = c.rake.w * T, rd = T * 1.3;
    const moving = Math.hypot(c.mvx, c.mvy) > 2;
    let raked = 0;

      if (!ALIVE[i]) continue;
      let vx = VX[i], vy = VY[i];
      const dx = X[i] - c.px, dy = Y[i] - c.py;

        const d = Math.hypot(dx, dy);

          const ang = Math.atan2(dy, dx), diff = Math.abs(H.math.angDiff(ang, c.aim));

            const f = power * (1 - d / range) * (1 - (diff / halfCone) * 0.6) * 900 * dt;

            ROT[i] += dt * 20; if (!FLY[i]) { FLY[i] = 1; LV.blownCount++; }
          }
        }

      if (rake && moving) {
        // leaves in the rectangle in front of the player (along aim) move with the player
        const along = dx * cosA + dy * sinA, side = -dx * sinA + dy * cosA;
        if (along > -2 && along < rd + 4 && Math.abs(side) < rw / 2 && raked < 400) { vx = c.mvx * 1.05 + (Math.random() - 0.5) * 6; vy = c.mvy * 1.05 + (Math.random() - 0.5) * 6; raked++; }
      }
      // vents
      for (let k = 0; k < c.vents.length; k++) { const v = c.vents[k]; const ex = v.x - X[i], ey = v.y - Y[i]; const d = Math.hypot(ex, ey); if (d < v.r) { if (d < 5) { LV.collect(i, 'vent'); break; } const f = (1 - d / v.r) * 380 * dt + 40 * dt; vx += (ex / d) * f; vy += (ey / d) * f; ROT[i] += dt * 8; } }
      if (!ALIVE[i]) continue;
      // bins: leaves pushed into a bin are sold
      for (let k = 0; k < c.bins.length; k++) { const b = c.bins[k]; if (Math.abs(X[i] - b.x) < b.r && Math.abs(Y[i] - b.y) < b.r && Math.hypot(vx, vy) > 8) { LV.collect(i, 'bin'); break; } }
      if (!ALIVE[i]) continue;
      // wind & water
      const tx = (X[i] / T) | 0, ty = (Y[i] / T) | 0;
      const water = W.isWater(tx, ty);
      if (c.wind.x || c.wind.y) { vx += c.wind.x * dt * (water ? 2 : 1); vy += c.wind.y * dt * (water ? 2 : 1); }
      if (water) { vx += Math.sin(H.time * 0.7 + i) * 3 * dt; vy += Math.cos(H.time * 0.5 + i * 0.3) * 3 * dt; }
      vx *= water ? frW : fr; vy *= water ? frW : fr;
      if (Math.abs(vx) < 0.05) vx = 0; if (Math.abs(vy) < 0.05) vy = 0;

        let nx = X[i] + vx * dt, ny = Y[i] + vy * dt;

        if (W.leafBlocked(((nx / T) | 0), (ny / T) | 0)) { ny = Y[i]; vy = -vy * 0.2; }
        X[i] = nx; Y[i] = ny;
        if (ROT[i] > 4) ROT[i] -= 4;
      } else FLY[i] = 0;
      VX[i] = vx; VY[i] = vy;
    }
  };
  // hand pickup: returns indices within radius, up to max
  LV.near = function (px, py, r, max) { const out = []; const r2 = r * r; for (let i = 0; i < LV.n && out.length < max; i++) { if (!ALIVE[i]) continue; const dx = X[i] - px, dy = Y[i] - py; if (dx * dx + dy * dy < r2) out.push(i); } return out; };
  LV.draw = function (g, ox, oy, vw, vh) {
    const x0 = ox - 4, y0 = oy - 4, x1 = ox + vw + 4, y1 = oy + vh + 4;
    for (let i = 0; i < LV.n; i++) {
      if (!ALIVE[i]) continue; const x = X[i], y = Y[i]; if (x < x0 || x > x1 || y < y0 || y > y1) continue;
      const fr = (ROT[i] | 0) & 3; const lift = FLY[i] && (Math.abs(VX[i]) + Math.abs(VY[i]) > 30) ? 2 : 0;
      if (lift) { g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect((x - ox) | 0, (y - oy + 1) | 0, 3, 1); }
      g.drawImage(A.leaf(TYPE[i], fr), (x - ox - 2) | 0, (y - oy - 2 - lift) | 0);
    }
  };
  LV.serialize = function () { const out = []; for (let i = 0; i < LV.n; i++) if (ALIVE[i]) out.push(Math.round(X[i] * 2), Math.round(Y[i] * 2), TYPE[i] * 8 + (ZONE[i] & 7)); return out; };
  LV.restore = function (arr) { LV.clear(); for (let k = 0; k + 2 < arr.length; k += 3) LV.add(arr[k] / 2, arr[k + 1] / 2, (arr[k + 2] / 8) | 0, arr[k + 2] & 7); };
})();

/* Hojarasca — 50_game.js  State, economy, upgrades, zones, gates, dumping, ending, save/load. */
(function () {
  'use strict';
  const H = window.Hojarasca;
  const T = H.TILE, W = H.world, LV = H.leaves;
  const G = (H.game = {});
  H.UPG = {
    bag: { caps: [10, 25, 60, 150, 400, 1000], costs: [15, 50, 150, 400, 1000], icon: 'bag' },
    rake: { w: [0, 1.5, 2.2, 3, 4], costs: [40, 120, 300, 700], icon: 'rake' },
    blower: { power: [0, 1, 1.5, 2.2, 3.2, 4.5], range: [0, 3.5, 4.5, 5.5, 6.5, 8], cone: [0, 50, 55, 60, 70, 80], costs: [150, 400, 900, 1800, 3500], icon: 'blower' },
    shoes: { speed: [70, 85, 100, 120], costs: [60, 200, 500], icon: 'shoes' },
    gloves: { r: [12, 18, 26], rate: [5, 9, 15], costs: [50, 150], icon: 'gloves' },
  };
  G.newState = () => ({ version: 1, coins: 0, bag: 0, bagValue: 0, tool: 'hand', up: { bag: 0, rake: 0, blower: 0, shoes: 0, gloves: 0 }, vents: {}, gates: {}, bins: { b_front: true }, zones: {}, stats: { leaves: 0, coins: 0, time: 0, dumps: 0, blown: 0 }, flags: {}, player: { x: 30 * T, y: 31 * T }, inCellar: false, ending: false, seed: (Math.random() * 1e9) | 0 });
  G.d = {};
  G.derive = function () {
    const S = H.state, u = S.up, U = H.UPG, d = G.d, z = S.zones;
    d.bagCap = U.bag.caps[u.bag] * (z.green && z.green.done ? 2 : 1);
    d.speed = U.shoes.speed[u.shoes] * (z.drive && z.drive.done ? 1.15 : 1);
    d.handR = U.gloves.r[u.gloves]; d.handRate = U.gloves.rate[u.gloves];
    d.rakeW = U.rake.w[u.rake];
    d.blower = { power: U.blower.power[u.blower] * (z.back && z.back.done ? 1.3 : 1), range: U.blower.range[u.blower] * T, cone: (U.blower.cone[u.blower] * Math.PI) / 180 };
    d.ventR = 2.6 * T * (z.pool && z.pool.done ? 1.5 : 1);
    d.valueMult = z.front && z.front.done ? 1.25 : 1;
    return d;
  };

  // ---- leaf collection ----------------------------------------------------------------------------
  G.pickup = function (i) { const S = H.state; if (S.bag >= G.d.bagCap) return false; LV.collect(i, 'hand'); return true; };

    const S = H.state, v = G.leafValue(i);

    if (how === 'hand') { S.bag += 1; S.bagValue += v; }
    else { S.coins += v; S.stats.coins += v; H.emit('sold', { i, v, how }); }

  };
  G.dump = function () { const S = H.state; if (S.bag <= 0) return 0; const v = Math.round(S.bagValue); S.coins += v; S.stats.coins += v; S.stats.dumps += 1; S.bag = 0; S.bagValue = 0; H.emit('dump', v); return v; };

  // ---- shop ------------------------------------------------------------------------------------------
  G.nextCost = (id) => { const u = H.UPG[id], lv = H.state.up[id]; return lv < u.costs.length ? u.costs[lv] : null; };
  G.buy = function (id) { const S = H.state, cost = G.nextCost(id); if (cost === null || S.coins < cost) return false; S.coins -= cost; S.up[id] += 1; G.derive(); if (id === 'rake' && S.up.rake === 1) S.tool = 'rake'; if (id === 'blower' && S.up.blower === 1) S.tool = 'blower'; H.emit('buy', id); return true; };
  G.buyVent = function (id) { const S = H.state, v = W.VENTS.find((x) => x.id === id); if (!v || S.vents[id] || S.coins < v.cost) return false; S.coins -= v.cost; S.vents[id] = true; H.emit('buy', id); return true; };
  G.buyBin = function (id) { const S = H.state, b = W.BINS.find((x) => x.id === id); if (!b || S.bins[id] || S.coins < b.cost) return false; S.coins -= b.cost; S.bins[id] = true; H.emit('buy', id); return true; };
  G.zoneUnlocked = (zid) => zid === 'front' || !!H.state.gates[zid];
  G.canOpenGate = function (id) { const S = H.state, g = W.GATES.find((x) => x.id === id); if (!g || S.gates[id]) return { ok: false }; if (id === 'cellar') { const all = W.ZONES.filter((z) => z.id !== 'cellar').every((z) => G.zoneProgress(z.id) >= 0.95); if (!all) return { ok: false, reason: 'cellar' }; } return { ok: S.coins >= g.cost, cost: g.cost }; };
  G.openGate = function (id) { const S = H.state, g = W.GATES.find((x) => x.id === id); const c = G.canOpenGate(id); if (!c.ok) return false; S.coins -= g.cost; S.gates[id] = true; H.emit('gate', id); return true; };
  G.activeVents = () => W.VENTS.filter((v) => H.state.vents[v.id]).map((v) => ({ x: v.tx * T + 8, y: v.ty * T + 8, r: G.d.ventR }));
  G.activeBins = () => W.BINS.filter((b) => H.state.bins[b.id]).map((b) => ({ x: b.tx * T + 8, y: b.ty * T + 8, r: 13 }));

  // ---- zones ------------------------------------------------------------------------------------------
  G.zoneProgress = function (zid) { const z = H.state.zones[zid]; if (!z || !z.total) return 0; return 1 - LV.countAlive(W.zoneIdx(zid)) / z.total; };
  G.totalProgress = function () { let tot = 0, left = 0; for (const z of W.ZONES) { const s = H.state.zones[z.id]; if (!s) continue; tot += s.total; left += LV.countAlive(W.zoneIdx(z.id)); } return tot ? 1 - left / tot : 0; };
  G.zoneCheck = function (zi) { const z = W.ZONES[zi], s = H.state.zones[z.id]; if (!s || s.done) return; if (LV.countAlive(zi) === 0) { s.done = true; G.derive(); H.emit('zoneDone', z.id); if (z.id === 'cellar') { H.state.ending = true; H.emit('ending'); } } };

  G.hasSave = () => { try { return !!localStorage.getItem(H.SAVE_KEY); } catch (e) { return false; } };

  G.clear = () => { try { localStorage.removeItem(H.SAVE_KEY); } catch (e) { /* ignore */ } };
  G.settings = { lang: 'en', music: true, sound: true };
  G.loadSettings = function () { try { const raw = localStorage.getItem(H.SETTINGS_KEY); if (raw) Object.assign(G.settings, JSON.parse(raw)); else if (/^es/i.test(navigator.language || '')) G.settings.lang = 'es'; } catch (e) { /* ignore */ } H.setLang(G.settings.lang); };
  G.saveSettings = () => { try { localStorage.setItem(H.SETTINGS_KEY, JSON.stringify(G.settings)); } catch (e) { /* ignore */ } };
  G.start = function (loaded) { H.state = loaded ? loaded.state : G.newState(); if (loaded) LV.restore(loaded.leaves); else G.spawnAll(); G.derive(); };
})();
