/* Leña — 00_util.js
   Namespace, math, seeded RNG, colours, number formatting, strings (EN/ES), events. */
(function () {
  'use strict';
  const L = (window.Lena = window.Lena || {});
  L.SAVE_KEY = 'lena.save.v1';
  L.SETTINGS_KEY = 'lena.settings.v1';

  const M = (L.math = {});
  M.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  M.lerp = (a, b, t) => a + (b - a) * t;
  M.easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  M.easeInCubic = (t) => t * t * t;
  M.easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  M.smooth = (t) => t * t * (3 - 2 * t);

  L.rng = function (seed) {
    let a = (seed >>> 0) || 0x9e3779b9;
    const r = function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    r.int = (n) => Math.floor(r() * n);
    r.range = (a, b) => a + r() * (b - a);
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    return r;
  };
  L.hash = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + (s | 0) * 982451653) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  const Col = (L.color = {});
  Col.parse = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
  Col.hex = (r, g, b) => '#' + [r, g, b].map((v) => M.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  Col.mix = (a, b, t) => { const A = Col.parse(a), B = Col.parse(b); return Col.hex(M.lerp(A[0], B[0], t), M.lerp(A[1], B[1], t), M.lerp(A[2], B[2], t)); };
  Col.shade = (h, k) => { const [r, g, b] = Col.parse(h); return Col.hex(r * k, g * k, b * k); };
  Col.lighten = (h, k) => Col.mix(h, '#ffffff', k);
  Col.rgba = (h, a) => { const [r, g, b] = Col.parse(h); return `rgba(${r},${g},${b},${a})`; };

  L.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  L.ctx2d = (cv) => { const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; return g; };
  L.now = () => (window.performance ? performance.now() : Date.now());

  // ---- number formatting: 1.23K, 45.6M, 7.89B ... ---------------------------------------
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td'];
  L.fmt = function (n) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + L.fmt(-n);
    if (n < 1000) return n < 10 && n !== Math.floor(n) ? n.toFixed(1) : String(Math.floor(n));
    let e = Math.floor(Math.log10(n) / 3);
    if (e >= SUF.length) return n.toExponential(2).replace('+', '');
    const m = n / Math.pow(1000, e);
    return (m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2)) + SUF[e];
  };
  L.fmtTime = function (s) {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h) return `${h}h ${m}m`;
    if (m) return `${m}m ${sec}s`;
    return `${sec}s`;
  };

      offline_title: 'While you were away', offline_body: '{time} passed. Your crew felled {trees} trees.', offline_sold: 'The wagon sold wood for {coins} coins.', offline_pile: 'Wood is piling up, go sell it!',
      settings: 'Settings', language: 'Language', music: 'Music', sound: 'Sound', on: 'On', off: 'Off', reset: 'Reset everything', reset_confirm: 'Erase all progress, acorns included?', yes: 'Yes', no: 'No', ok: 'Okay', close: 'Close',
      crit: 'CRIT', new_species: 'New tree: {name}!', ach_unlocked: 'Achievement: {name}', ach_bonus: 'Each achievement gives +2% to everything.',
      a_first: 'First cut', a_felled10: 'Ten down', a_felled100: 'Clearing', a_felled1000: 'Deforester', a_felled10000: 'Legend of the axe',

      a_crew1: 'Not alone', a_crew10: 'A proper crew', a_crew50: 'Company town', a_mill: 'Sawdust', a_wagon: 'Wheels', a_oak: 'Hardwood', a_redwood: 'Giants', a_worldtree: 'Roots of the world', a_forest1: 'Fresh start', a_forest5: 'Nomad', a_crit: 'Clean split',
    },
    es: {

      lv: 'Nv', max: 'MÁX', buy: 'Comprar', hire: 'Contratar', owned: 'tienes', each: 'c/u', per_s: '/s', per_tap: '/toque', crew_dps: 'Equipo',
      up_axe: 'Hacha', up_axe_d: 'Daño por toque ×2',

      sp_pine: 'Pino', sp_birch: 'Abedul', sp_oak: 'Roble', sp_maple: 'Arce', sp_redwood: 'Secuoya', sp_ancient: 'Roble ancestral', sp_ironwood: 'Palo de hierro', sp_worldtree: 'Árbol del mundo',
      tree_n: 'Árbol #{n}', next_species: 'Siguiente: {name} en el árbol #{n}', last_species: 'No hay árbol más grande en este bosque.', log_worth: 'Cada tronco vale {v} monedas',
      prestige: 'Plantar un nuevo bosque', prestige_d: 'Empieza de cero en un bosque nuevo. Conservas tus bellotas: cada una da +10% de daño e ingresos para siempre.',
      prestige_gain: 'Ganarías {n} bellotas', prestige_need: 'Primero gana {n} monedas en este bosque ({p}%)', prestige_confirm: '¿Plantar un nuevo bosque? Monedas, mejoras y equipo se reinician. Bellotas y logros se conservan.',
      forests: 'Bosques plantados', st_felled: 'Árboles talados', st_taps: 'Toques', st_earned: 'Ganado en este bosque', st_lifetime: 'Ganado en total', st_crew: 'Tamaño del equipo', st_time: 'Tiempo jugado', st_ach: 'Logros', st_best: 'Mejor árbol',

      settings: 'Ajustes', language: 'Idioma', music: 'Música', sound: 'Sonido', on: 'Sí', off: 'No', reset: 'Borrar todo', reset_confirm: '¿Borrar todo el progreso, bellotas incluidas?', yes: 'Sí', no: 'No', ok: 'Vale', close: 'Cerrar',
      crit: 'CRÍTICO', new_species: '¡Nuevo árbol: {name}!', ach_unlocked: 'Logro: {name}', ach_bonus: 'Cada logro da +2% a todo.',
      a_first: 'Primer corte', a_felled10: 'Diez menos', a_felled100: 'Claro del bosque', a_felled1000: 'Deforestador', a_felled10000: 'Leyenda del hacha',
      a_taps100: 'Manos calientes', a_taps1000: 'Ampollas', a_taps10000: 'Muñecas de hierro', a_coins1k: 'Para el bolsillo', a_coins100k: 'Ahorros', a_coins10m: 'Barón maderero', a_coins1b: 'Dinero viejo',

  L.t = function (key, vars) {
    let s = (S[L.lang] && S[L.lang][key]) || S.en[key] || key;
    if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    return s;

<script>
/* Leña — 10_art.js
   Procedural pixel art: trees per species, lumberjacks with axes, stump, sapling,
   sawmill, wagon, log pile, parallax backdrops, UI icons. */
(function () {
  'use strict';
  const L = window.Lena;
  const Col = L.color;

  function sprite(w, h, fn) {
    const cv = L.canvas(w, h), g = L.ctx2d(cv);
    const P = {
      w, h, g, cv,
      px(x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); },
      rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); },
      hline(x, y, w, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, 1); },
      vline(x, y, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, h | 0); },
      disc(cx, cy, r, c) { g.fillStyle = c; for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) { const dx = x + 0.5 - cx, dy = y + 0.5 - cy; if (dx * dx + dy * dy <= r * r) g.fillRect(x, y, 1, 1); } },
      ellipse(cx, cy, rx, ry, c) { g.fillStyle = c; for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1); } },
      tri(cx, top, w, h, c) { g.fillStyle = c; for (let y = 0; y < h; y++) { const ww = Math.round((y / h) * w); g.fillRect(Math.round(cx - ww / 2), top + y, Math.max(1, ww), 1); } },
      line(x0, y0, x1, y1, c) { g.fillStyle = c; x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy; for (;;) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } } },
      blit(img, x, y) { g.drawImage(img, x | 0, y | 0); },
    };
    fn(P, g);
    return cv;
  }
  L.sprite = sprite;
  const A = (L.art = {});
  const cache = new Map();
  const memo = (k, fn) => { if (!cache.has(k)) cache.set(k, fn()); return cache.get(k); };
  A.memo = memo;

  // ---- species visuals ------------------------------------------------------------------
  A.SPECIES_LOOK = {
    pine: { trunk: '#6b4a2b', leaf: ['#2f6e3a', '#3f8a4a', '#245a30'], shape: 'pine', h: 64, w: 40 },
    birch: { trunk: '#e8e6dc', leaf: ['#7cc45c', '#9ad67a', '#5aa64a'], shape: 'round', h: 74, w: 40, marks: '#3a3a3a' },
    oak: { trunk: '#5a3a20', leaf: ['#3f8f3a', '#5aa64a', '#2f7a30'], shape: 'round', h: 84, w: 70 },
    maple: { trunk: '#6b4a2b', leaf: ['#d0602a', '#e88a3a', '#b84a2a'], shape: 'round', h: 88, w: 66 },
    redwood: { trunk: '#8a3a2a', leaf: ['#2f6e3a', '#3f8a4a', '#1f5a2a'], shape: 'pine', h: 124, w: 52 },
    ancient: { trunk: '#4a3a2a', leaf: ['#2a6a3a', '#4a9a5a', '#1a4a2a'], shape: 'round', h: 112, w: 110, vines: true },
    ironwood: { trunk: '#3a4a5a', leaf: ['#4a6a7a', '#6a8a9a', '#2a4a5a'], shape: 'pine', h: 120, w: 60 },
    worldtree: { trunk: '#5a4a6a', leaf: ['#7a5aa0', '#a08ad0', '#5a3a80'], shape: 'round', h: 136, w: 122, glow: '#e0d0ff' },
  };

  // Tree canvas: base pivot is bottom-centre. Returns canvas with .baseX/.baseY.
  A.tree = function (species, seed) {
    return memo('tree' + species + seed, () => {
      const k = A.SPECIES_LOOK[species], r = L.rng(seed * 131 + 7);
      const w = k.w + 8, h = k.h + 6;
      const cv = sprite(w, h, (P) => {
        const cx = w / 2, base = h - 1;
        const tw = Math.max(4, Math.round(k.w * (k.shape === 'pine' ? 0.14 : 0.18)));
        const trunkTop = k.shape === 'pine' ? base - Math.round(k.h * 0.35) : base - Math.round(k.h * 0.55);
        // trunk with shading
        P.rect(cx - tw / 2, trunkTop, tw, base - trunkTop + 1, k.trunk);
        P.rect(cx - tw / 2, trunkTop, Math.max(1, tw / 3), base - trunkTop + 1, Col.shade(k.trunk, 0.8));
        P.rect(cx + tw / 2 - 1, trunkTop, 1, base - trunkTop + 1, Col.lighten(k.trunk, 0.15));
        // roots flare
        P.rect(cx - tw / 2 - 2, base - 2, tw + 4, 3, k.trunk); P.rect(cx - tw / 2 - 3, base, tw + 6, 1, Col.shade(k.trunk, 0.8));
        if (k.marks) for (let y = trunkTop + 4; y < base - 4; y += 5 + r.int(4)) P.rect(cx - tw / 2 + r.int(tw - 1), y, 2, 1, k.marks);
        if (k.shape === 'pine') {
          const layers = 4 + Math.round(k.h / 30);
          const top = base - k.h + 2;
          for (let i = layers - 1; i >= 0; i--) {
            const y0 = top + (i * (trunkTop - top)) / layers + 2;
            const lw = k.w * (0.35 + 0.65 * (i + 1) / layers), lh = (trunkTop - top) / layers * 1.6 + 4;
            P.tri(cx + r.int(3) - 1, y0, lw, lh, k.leaf[i % 2]);
            P.tri(cx - lw * 0.15, y0 + 2, lw * 0.55, lh * 0.8, k.leaf[2]);
          }
          P.tri(cx, top - 2, 6, 8, k.leaf[1]);
        } else {
          const cy = trunkTop - k.h * 0.2, rx = k.w / 2, ry = k.h * 0.3;
          // branches
          for (let i = 0; i < 4; i++) { const dir = i % 2 ? 1 : -1; P.line(cx, trunkTop + 6 + i * 4, cx + dir * (rx * 0.5 + r.int(rx * 0.3)), cy + r.int(ry * 0.8) - ry * 0.4, k.trunk); }
          P.ellipse(cx, cy, rx, ry, k.leaf[2]);
          const blobs = 5 + Math.round(k.w / 12);
          for (let i = 0; i < blobs; i++) { const a = r() * 6.28, d = Math.sqrt(r()) * 0.7; P.ellipse(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, rx * 0.35 + r.int(rx * 0.2), ry * 0.35 + r.int(ry * 0.2), k.leaf[r.chance(0.5) ? 0 : 1]); }
          for (let i = 0; i < blobs * 3; i++) { const a = r() * 6.28, d = Math.sqrt(r()) * 0.9; P.px(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, Col.lighten(k.leaf[1], 0.25)); }
          if (k.vines) for (let i = 0; i < 6; i++) { const x = cx - rx * 0.6 + r.int(rx * 1.2); P.vline(x, cy + ry * 0.6, 6 + r.int(10), k.leaf[2]); }
          if (k.glow) for (let i = 0; i < 14; i++) { const a = r() * 6.28, d = Math.sqrt(r()) * 0.9; P.px(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, k.glow); }
        }
      });
      cv.baseX = w / 2; cv.baseY = h - 1;
      return cv;
    });
  };
  A.stump = (species) => memo('stump' + species, () => { const k = A.SPECIES_LOOK[species]; const tw = Math.max(6, Math.round(k.w * 0.2)); return sprite(tw + 6, 9, (P) => { P.rect(3, 3, tw, 6, k.trunk); P.rect(3, 3, 2, 6, Col.shade(k.trunk, 0.8)); P.ellipse(3 + tw / 2, 3, tw / 2, 1.6, '#d8b878'); P.ellipse(3 + tw / 2, 3, tw / 4, 0.8, '#b89058'); P.rect(1, 7, tw + 4, 2, Col.shade(k.trunk, 0.85)); }); });
  A.sapling = (species, stage) => memo('sap' + species + stage, () => { const k = A.SPECIES_LOOK[species]; return sprite(16, 20, (P) => { const h = 4 + stage * 4; P.vline(8, 19 - h, h, k.trunk); P.ellipse(6, 19 - h, 2 + stage, 1.5 + stage * 0.5, k.leaf[1]); P.ellipse(10, 18 - h - stage, 2 + stage, 1.5 + stage * 0.5, k.leaf[0]); P.px(8, 17 - h - stage, k.leaf[1]); }); });

  // ---- characters -------------------------------------------------------------------------
  // dir: 1 left 2 right. frame: 0 idle, 1 raise, 2 chop
  A.human = function (cfg, dir, frame) {
    return memo('hum' + JSON.stringify(cfg) + dir + frame, () => sprite(16, 20, (P) => {

<script>
/* Leña — 30_game.js
   State, balance, upgrades, tree lifecycle, selling, prestige, achievements,
   offline progress, save/load. Pure logic: no drawing here. */
(function () {
  'use strict';
  const L = window.Lena;
  const G = (L.game = {});

  L.SPECIES = [
    { id: 'pine', at: 0, hp: 12, value: 1 },
    { id: 'birch', at: 15, hp: 60, value: 3 },
    { id: 'oak', at: 40, hp: 400, value: 12 },
    { id: 'maple', at: 80, hp: 3000, value: 45 },
    { id: 'redwood', at: 140, hp: 25000, value: 180 },
    { id: 'ancient', at: 220, hp: 250000, value: 900 },
    { id: 'ironwood', at: 320, hp: 3e6, value: 5000 },
    { id: 'worldtree', at: 450, hp: 5e7, value: 40000 },
  ];
  L.UPG = {
    axe: { base: 25, growth: 2.6, max: 26, icon: 'axe', tab: 'chop' },
    sharpen: { base: 80, growth: 5, max: 10, icon: 'whetstone', tab: 'chop' },
    hire: { base: 30, growth: 1.27, max: 300, icon: 'worker', tab: 'crew' },
    training: { base: 200, growth: 5, max: 24, icon: 'book', tab: 'crew' },
    coffee: { base: 1500, growth: 7, max: 12, icon: 'coffee', tab: 'crew' },
    growth: { base: 60, growth: 3.5, max: 12, icon: 'sapling', tab: 'forest' },
    market: { base: 150, growth: 3, max: 30, icon: 'scale', tab: 'trade' },
    merchant: { base: 300, growth: 3.6, max: 12, icon: 'wagon', tab: 'trade' },
    mill: { base: 800, growth: 4.5, max: 15, icon: 'mill', tab: 'trade' },
  };
  L.TABS = { chop: ['axe', 'sharpen'], crew: ['hire', 'training', 'coffee'], trade: ['market', 'merchant', 'mill'], forest: ['growth'] };
  L.PRESTIGE_MIN = 1e6;

  G.newState = () => ({
    version: 1,
    coins: 0, earnedRun: 0, lifetimeEarned: 0, acorns: 0, forests: 0,
    logs: 0, logValue: 0, planks: 0, plankValue: 0,
    up: { axe: 0, sharpen: 0, hire: 0, training: 0, coffee: 0, growth: 0, market: 0, merchant: 0, mill: 0 },
    felled: 0, lifetimeFelled: 0, taps: 0, crits: 0, bestSpecies: 0,
    tree: null, merchantT: 0, playTime: 0, lastSeen: Date.now(),
    ach: {}, flags: {}, buyMode: 1,
  });

  G.speciesFor = (n) => { let s = L.SPECIES[0]; for (const sp of L.SPECIES) if (n >= sp.at) s = sp; return s; };
  G.nextSpecies = (n) => L.SPECIES.find((sp) => sp.at > n) || null;
  G.hpFor = (n) => { const sp = G.speciesFor(n); return sp.hp * Math.pow(1.06, n - sp.at); };
  G.logsFor = (n) => { const sp = G.speciesFor(n); return 6 + Math.floor((n - sp.at) / 8); };
  G.cost = (id, lvl) => L.UPG[id].base * Math.pow(L.UPG[id].growth, lvl);
  G.costN = (id, n) => { const S = L.state; let c = 0; for (let i = 0; i < n; i++) { if (S.up[id] + i >= L.UPG[id].max) break; c += G.cost(id, S.up[id] + i); } return c; };
  G.affordableN = (id) => { const S = L.state; let n = 0, c = 0; while (S.up[id] + n < L.UPG[id].max) { const cc = G.cost(id, S.up[id] + n); if (c + cc > S.coins) break; c += cc; n++; if (n >= 1000) break; } return n; };
  G.buyCount = (id) => { const S = L.state; const left = L.UPG[id].max - S.up[id]; if (S.buyMode === 'max') return Math.max(1, Math.min(left, G.affordableN(id))); return Math.min(left, S.buyMode); };

  // ---- derived multipliers ---------------------------------------------------------------
  G.d = {};
  G.derive = function () {
    const S = L.state, u = S.up, d = G.d;
    d.achCount = Object.keys(S.ach).length;
    d.global = (1 + 0.1 * S.acorns) * (1 + 0.02 * d.achCount);
    d.axe = Math.pow(2, u.axe) * d.global;
    d.crit = 0.04 * u.sharpen;
    d.crewEach = 0.6 * d.axe * Math.pow(1.5, u.training) * Math.pow(1.15, u.coffee);
    d.crew = u.hire * d.crewEach;
    d.regrow = 4 * Math.pow(0.8, u.growth);
    d.sell = Math.pow(1.25, u.market) * d.global;
    d.merchant = u.merchant ? 20 * Math.pow(0.85, u.merchant - 1) : 0;
    d.mill = u.mill ? Math.pow(1.6, u.mill - 1) : 0;
    return d;
  };

  // ---- tree lifecycle ---------------------------------------------------------------------
  G.spawnTree = function (state) {
    const S = L.state, n = S.felled, sp = G.speciesFor(n);
    S.tree = { n, species: sp.id, hp: G.hpFor(n), maxHp: G.hpFor(n), state: state || 'up', t: 0, seed: n * 7 + S.forests * 13 };
  };
  G.stockValue = () => (L.state.logValue + L.state.plankValue * 5) * G.d.sell;

  G.damage = function (amount, src) {
    const S = L.state, T = S.tree; if (!T || T.state !== 'up') return 0;
    T.hp -= amount;
    if (T.hp <= 0) { T.hp = 0; G.fell(); }
    return amount;
  };
  G.fell = function () {
    const S = L.state, T = S.tree, sp = G.speciesFor(T.n);
    const logs = G.logsFor(T.n);
    S.logs += logs; S.logValue += logs * sp.value;
    S.felled += 1; S.lifetimeFelled += 1;
    T.state = 'falling'; T.t = 0;
    const spIdx = L.SPECIES.indexOf(sp); if (spIdx > S.bestSpecies) S.bestSpecies = spIdx;
    L.emit('fell', { logs, species: sp.id, n: T.n });
    G.checkAch();
  };
  G.chop = function () {
    const S = L.state; if (!S.tree || S.tree.state !== 'up') return null;
    const crit = Math.random() < G.d.crit; const dmg = G.d.axe * (crit ? 4 : 1);
    S.taps += 1; if (crit) S.crits += 1;
    G.damage(dmg, 'tap');
    return { dmg, crit };
  };

  // ---- tick ----------------------------------------------------------------------------------
  G.tick = function (dt, silent) {
    const S = L.state, d = G.d, T = S.tree;
    S.playTime += dt;
    if (T.state === 'falling') { T.t += dt; if (T.t >= 1.0) { G.spawnTree('grow'); if (!silent) L.emit('regrow'); } }
    else if (T.state === 'grow') { T.t += dt; if (T.t >= d.regrow) { T.state = 'up'; T.t = 0; if (!silent) L.emit('treeUp', T); } }
    else if (d.crew > 0) G.damage(d.crew * dt, 'crew');
    if (d.mill > 0 && S.logs > 0) { const conv = Math.min(S.logs, d.mill * dt); const frac = conv / S.logs; const v = S.logValue * frac; S.logs -= conv; S.logValue -= v; S.planks += conv; S.plankValue += v; if (S.logs < 1e-6) { S.logs = 0; S.logValue = 0; } }
    if (d.merchant > 0) { S.merchantT += dt; if (S.merchantT >= d.merchant) { S.merchantT = 0; if (S.logs + S.planks > 0.5) G.sell(true, silent); } }
  };
  G.sell = function (auto, silent) {
    const S = L.state; const v = G.stockValue(); if (v <= 0) return 0;
    S.coins += v; S.earnedRun += v; S.lifetimeEarned += v;
    S.logs = 0; S.logValue = 0; S.planks = 0; S.plankValue = 0;
    if (!silent) L.emit('sell', { coins: v, auto });
    G.checkAch();
    return v;
  };
  G.buy = function (id, n) {
    const S = L.state, u = L.UPG[id]; n = n || G.buyCount(id);
    const cost = G.costN(id, n); if (n <= 0 || S.coins < cost || S.up[id] >= u.max) return false;
    S.coins -= cost; S.up[id] = Math.min(u.max, S.up[id] + n);
    G.derive(); L.emit('buy', { id, n }); G.checkAch();
    return true;
  };

  // ---- prestige ------------------------------------------------------------------------------
  G.prestigeGain = () => (L.state.earnedRun >= L.PRESTIGE_MIN ? Math.floor(3 * Math.sqrt(L.state.earnedRun / L.PRESTIGE_MIN)) : 0);
  G.prestige = function () {
    const S = L.state, gain = G.prestigeGain(); if (gain <= 0) return false;
    S.acorns += gain; S.forests += 1;
    S.coins = 0; S.earnedRun = 0; S.logs = 0; S.logValue = 0; S.planks = 0; S.plankValue = 0; S.felled = 0; S.merchantT = 0;
    for (const k in S.up) S.up[k] = 0;
    G.derive(); G.spawnTree('up'); G.checkAch();
    L.emit('prestige', { gain });
    return true;
  };

  // ---- achievements ------------------------------------------------------------------------------
  L.ACH = [
    ['first', (S) => S.lifetimeFelled >= 1], ['felled10', (S) => S.lifetimeFelled >= 10], ['felled100', (S) => S.lifetimeFelled >= 100], ['felled1000', (S) => S.lifetimeFelled >= 1000], ['felled10000', (S) => S.lifetimeFelled >= 10000],
    ['taps100', (S) => S.taps >= 100], ['taps1000', (S) => S.taps >= 1000], ['taps10000', (S) => S.taps >= 10000],
    ['coins1k', (S) => S.lifetimeEarned >= 1e3], ['coins100k', (S) => S.lifetimeEarned >= 1e5], ['coins10m', (S) => S.lifetimeEarned >= 1e7], ['coins1b', (S) => S.lifetimeEarned >= 1e9],
    ['crew1', (S) => S.up.hire >= 1], ['crew10', (S) => S.up.hire >= 10], ['crew50', (S) => S.up.hire >= 50], ['mill', (S) => S.up.mill >= 1], ['wagon', (S) => S.up.merchant >= 1],
    ['oak', (S) => S.bestSpecies >= 2], ['redwood', (S) => S.bestSpecies >= 4], ['worldtree', (S) => S.bestSpecies >= 7], ['forest1', (S) => S.forests >= 1], ['forest5', (S) => S.forests >= 5], ['crit', (S) => S.crits >= 1],
  ];
  G.checkAch = function () {
    const S = L.state; let any = false;
    for (const [id, fn] of L.ACH) if (!S.ach[id] && fn(S)) { S.ach[id] = Date.now(); any = true; L.emit('ach', id); }
    if (any) G.derive();
  };

  // ---- offline ------------------------------------------------------------------------------------
  G.simulateOffline = function (seconds) {
    const S = L.state; seconds = Math.min(seconds, 8 * 3600); if (seconds < 5) return null;
    const felled0 = S.lifetimeFelled, coins0 = S.coins;
    const steps = Math.ceil(seconds); const dt = seconds / steps;
    for (let i = 0; i < steps; i++) G.tick(dt, true);
    G.checkAch();
    return { seconds, trees: S.lifetimeFelled - felled0, coins: S.coins - coins0, pile: S.logs + S.planks };
  };

  // ---- save / load ----------------------------------------------------------------------------------
  G.save = function () { try { L.state.lastSeen = Date.now(); localStorage.setItem(L.SAVE_KEY, JSON.stringify(L.state)); return true; } catch (e) { return false; } };
  G.load = function () { try { const raw = localStorage.getItem(L.SAVE_KEY); if (!raw) return null; const s = Object.assign(G.newState(), JSON.parse(raw)); s.up = Object.assign(G.newState().up, s.up || {}); return s; } catch (e) { return null; } };
  G.clear = function () { try { localStorage.removeItem(L.SAVE_KEY); } catch (e) { /* ignore */ } };
  G.settings = { lang: 'en', music: true, sound: true };
  G.loadSettings = function () { try { const raw = localStorage.getItem(L.SETTINGS_KEY); if (raw) Object.assign(G.settings, JSON.parse(raw)); else if (/^es/i.test(navigator.language || '')) G.settings.lang = 'es'; } catch (e) { /* ignore */ } L.setLang(G.settings.lang); };
  G.saveSettings = function () { try { localStorage.setItem(L.SETTINGS_KEY, JSON.stringify(G.settings)); } catch (e) { /* ignore */ } };

  G.boot = function () {
    const loaded = G.load();
    L.state = loaded || G.newState();
    G.derive();
    if (!L.state.tree) G.spawnTree('up');
    let offline = null;
    if (loaded) { const away = (Date.now() - (loaded.lastSeen || Date.now())) / 1000; if (away > 30) offline = G.simulateOffline(away); }
    return offline;
  };
})();

<script>
/* Leña — 40_ui.js
   Immediate-mode touch UI: HUD over the scene, tabbed upgrade panel, toasts,
   floating numbers and modal dialogs. Re-registers hit rectangles every frame. */
(function () {
  'use strict';
  const L = window.Lena;
  const { clamp } = L.math;
  const A = L.art, G = L.game;
  const UI = (L.ui = {});
  const FONT = 'ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif';
  const PAL = { panel: '#1f2b26', row: '#2a3a33', rowHi: '#33463d', ink: '#f4ead8', soft: '#a8b8a8', amber: '#e8a030', amberD: '#b87a20', green: '#6ad06a', red: '#e05a4a', coin: '#ffd866', hud: 'rgba(16,24,20,0.72)', dim: 'rgba(8,12,10,0.6)', tabOn: '#3a5046' };
  UI.PAL = PAL;
  UI.safe = { t: 0, r: 0, b: 0, l: 0 };
  UI.layout = { scene: { x: 0, y: 0, w: 100, h: 100 }, panel: { x: 0, y: 100, w: 100, h: 100 }, landscape: false };
  UI.modal = null; UI.toasts = []; UI.floats = []; UI.tab = 'chop'; UI.scroll = {}; UI.hintText = null;
  let hits = [], pressed = null, pressedT = 0, cssW = 0, cssH = 0;

  // ---- helpers -----------------------------------------------------------------------------
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function text(g, s, x, y, size, color, align, weight) { g.font = `${weight || 600} ${size}px ${FONT}`; g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y); }
  function textW(g, s, size, weight) { g.font = `${weight || 600} ${size}px ${FONT}`; return g.measureText(s).width; }
  function icon(g, name, x, y, size) { g.imageSmoothingEnabled = false; g.drawImage(A.icon(name), x, y, size, size); }
  function wrap(g, s, maxW, size, weight) { g.font = `${weight || 500} ${size}px ${FONT}`; const out = []; for (const para of String(s).split('\n')) { let line = ''; for (const word of para.split(' ')) { const t = line ? line + ' ' + word : word; if (g.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t; } out.push(line); } return out; }
  function hit(x, y, w, h, fn, id) { hits.push({ x, y, w, h, fn, id: id || fn }); }
  UI.rr = rr; UI.text = text; UI.icon = icon; UI.hit = hit;

  function btn(g, id, x, y, w, h, label, o) {
    o = o || {};
    const dis = !!o.disabled, isP = pressed === id && pressedT > 0;
    const bg = dis ? '#3a4a42' : o.kind === 'green' ? PAL.green : o.kind === 'ghost' ? 'rgba(255,255,255,0.08)' : PAL.amber;
    const fg = dis ? '#7a8a82' : o.kind === 'ghost' ? PAL.ink : '#1f1a10';
    g.save(); if (isP) g.translate(0, 1);
    rr(g, x, y + 2, w, h, 12); g.fillStyle = 'rgba(0,0,0,0.3)'; g.fill();
    rr(g, x, y, w, h, 12); g.fillStyle = bg; g.fill();
    if (!dis && o.kind !== 'ghost') { rr(g, x + 1, y + 1, w - 2, h / 2, 10); g.fillStyle = 'rgba(255,255,255,0.18)'; g.fill(); }
    let tx = x + w / 2, lw = label ? textW(g, label, o.size || 15, 800) : 0;
    if (o.icon) { const sz = Math.min(24, h - 12); const total = sz + 6 + lw; const ix = x + (w - total) / 2; icon(g, o.icon, ix, y + (h - sz) / 2, sz); tx = ix + sz + 6 + lw / 2; }
    if (label) text(g, label, tx, y + h / 2 + (o.sub ? -6 : 0), o.size || 15, fg, 'center', 800);
    if (o.sub) text(g, o.sub, x + w / 2, y + h / 2 + 10, 10, dis ? '#7a8a82' : 'rgba(0,0,0,0.6)', 'center', 700);
    g.restore();
    if (!dis) hit(x, y, w, h, o.fn, id);
  }
  UI.btn = btn;

  UI.toast = (msg, ic) => { UI.toasts.push({ msg, icon: ic, t: 0, life: 2.6 }); if (UI.toasts.length > 3) UI.toasts.shift(); };
  UI.float = (x, y, s, color, size) => { UI.floats.push({ x, y, s, color, size: size || 16, t: 0, vx: (Math.random() - 0.5) * 30 }); if (UI.floats.length > 40) UI.floats.shift(); };
  UI.open = (type, data) => { UI.modal = { type, data: data || {}, t: 0 }; };
  UI.close = () => { UI.modal = null; L.audio.sfx('back'); };

  // ---- layout ------------------------------------------------------------------------------
  UI.resize = function (w, h) {
    cssW = w; cssH = h;
    const s = UI.safe, landscape = w > h * 1.15;
    if (landscape) { const sw = Math.round(w * 0.62); UI.layout = { landscape, scene: { x: 0, y: 0, w: sw, h }, panel: { x: sw, y: 0, w: w - sw, h } }; }
    else { const sh = Math.round(h * 0.5); UI.layout = { landscape, scene: { x: 0, y: 0, w, h: sh }, panel: { x: 0, y: sh, w, h: h - sh } }; }
  };

  // ---- input ------------------------------------------------------------------------------------
  let down = null, scrollDrag = null;
  UI.bindInput = function (canvas) {
    const pos = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault(); L.audio.init();

  UI.update = (dt) => { if (pressedT > 0) pressedT -= dt; if (UI.modal) UI.modal.t += dt; };
  UI.draw = function (g, dt) {

<script>

  // ---- events ---------------------------------------------------------------------------------

  }
  MN.lastSell = [0, 0];
  MN.sellTap = function (x, y) { MN.lastSell = [x, y]; const v = G.sell(false); if (v > 0) UI.float(x, y - 30, '+' + L.fmt(v), UI.PAL.coin, 20); };
  MN.chopAt = function (x, y) {

    const tx = sc.x + sc.w / 2 + (Math.random() - 0.5) * 40, ty = sc.y + sc.h - 26 * scale - 60 - Math.random() * 40;
    UI.float(tx, ty, (res.crit ? L.t('crit') + ' ' : '') + L.fmt(res.dmg), res.crit ? '#ffb040' : '#fff', res.crit ? 20 : 15);
    UI.hintText = UI.hintText && L.state.taps > 12 ? null : UI.hintText;
  };
  MN.resetAll = function () { G.clear(); L.state = G.newState(); G.derive(); G.spawnTree('up'); UI.modal = null; UI.tab = 'chop'; UI.scroll = {}; G.save(); };

  // ---- particles ------------------------------------------------------------------------------------
  function chips(n) { const b = backdrop, T = L.state.tree, cv = A.tree(T.species, T.seed); const x = b.w / 2, y = b.gy - 6 - Math.random() * Math.min(20, cv.height * 0.3); for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 70, vy: -30 - Math.random() * 50, g: 160, life: 0.5 + Math.random() * 0.4, t: 0, c: Math.random() < 0.5 ? '#e0b878' : '#a8784a', s: 1 + (Math.random() < 0.3 ? 1 : 0) }); }
  function leavesBurst() { const b = backdrop, T = L.state.tree, k = A.SPECIES_LOOK[T.species], cv = A.tree(T.species, T.seed); for (let i = 0; i < 14; i++) particles.push({ x: b.w / 2 + (Math.random() - 0.5) * cv.width * 0.8, y: b.gy - cv.height * (0.4 + Math.random() * 0.5), vx: (Math.random() - 0.5) * 30, vy: -10 + Math.random() * 10, g: 25, life: 1.2 + Math.random(), t: 0, c: k.leaf[Math.floor(Math.random() * 3)], s: 1, leaf: true }); }

  function coinFlyers(x, y, n) { const sc = UI.layout.scene; const pn = UI.layout.panel, tx = pn.x + (UI.layout.landscape ? 0 : UI.safe.l) + 30, ty = pn.y + (UI.layout.landscape ? UI.safe.t : 0) + 30; for (let i = 0; i < n; i++) flyers.push({ x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 20, tx, ty, t: -i * 0.04, dur: 0.55 + Math.random() * 0.2 }); }

  // ---- loop ------------------------------------------------------------------------------------------
  function loop(now) {
    const dt = Math.min(0.05, (now - (lastNow || now)) / 1000); lastNow = now; time += dt;
    update(dt); render(dt); requestAnimationFrame(loop);
  }
  function update(dt) {
    const S = L.state, T = S.tree;
    UI.update(dt);
    if (!UI.modal) G.tick(dt);
    const prevState = T.state;
    if (T.state === 'falling' && T.t >= 0.86 && !thudDone) { thudDone = true; shake = 6; L.audio.sfx('thud'); }
    wobble = Math.max(0, wobble - dt * 4); shake = Math.max(0, shake - dt * 14); playerSwing = Math.max(0, playerSwing - dt);

    L.audio.env.saw = milling ? 1 : 0; L.audio.env.night = nightAmount(); L.audio.update(dt);

  }
  function dayPhase() { return (L.state.playTime % 480) / 480; }
  function nightAmount() { const p = dayPhase(); if (p < 0.55) return 0; if (p < 0.65) return (p - 0.55) / 0.1; if (p < 0.9) return 1; return 1 - (p - 0.9) / 0.1; }

  const SKY = [
    [0.0, '#f2a35a', '#f6d08a'], [0.12, '#7fbfe8', '#d6ecf5'], [0.5, '#6fb4e0', '#cfe6f2'], [0.6, '#e07a5a', '#f2c08a'], [0.68, '#1a2340', '#3a4a6a'], [0.9, '#101830', '#26304a'], [1.0, '#f2a35a', '#f6d08a'],
  ];
  function skyColors(p) { for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) { const [t0, a0, b0] = SKY[i - 1], [t1, a1, b1] = SKY[i]; const t = (p - t0) / (t1 - t0); return [L.color.mix(a0, a1, t), L.color.mix(b0, b1, t)]; } return ['#6fb4e0', '#cfe6f2']; }

    const grad = wg.createLinearGradient(0, 0, 0, gy); grad.addColorStop(0, top); grad.addColorStop(1, bot); wg.fillStyle = grad; wg.fillRect(0, 0, w, h);

    for (const c of clouds) { c.x += c.v * dt; if (c.x > w + 40) c.x = -40; const cx0 = Math.round(c.x), cy0 = Math.round(c.y); wg.fillStyle = `rgba(255,255,255,${0.85 - night * 0.6})`; wg.beginPath(); wg.ellipse(cx0, cy0, 16 * c.s, 5 * c.s, 0, 0, 7); wg.ellipse(cx0 - 8 * c.s, cy0 + 2, 9 * c.s, 4 * c.s, 0, 0, 7); wg.ellipse(cx0 + 9 * c.s, cy0 + 1, 10 * c.s, 4.5 * c.s, 0, 0, 7); wg.fill(); }
    if (night < 0.5) for (const bd of birds) { bd.x += bd.v * dt; if (bd.x > w + 10) { bd.x = -10; bd.y = 20 + Math.random() * Math.max(10, gy * 0.4); } const fl = Math.sin(time * 6 + bd.ph) > 0 ? 1 : 0; wg.fillStyle = `rgba(40,50,60,${0.8 - night})`; wg.fillRect(Math.round(bd.x) - 2, Math.round(bd.y) - fl, 2, 1); wg.fillRect(Math.round(bd.x), Math.round(bd.y) - fl, 2, 1); wg.fillRect(Math.round(bd.x) - 3, Math.round(bd.y) - fl + 1, 1, 1); wg.fillRect(Math.round(bd.x) + 2, Math.round(bd.y) - fl + 1, 1, 1); }
    if (night > 0) { wg.fillStyle = `rgba(255,255,255,${0.9 * night})`; for (const [x, y, tw] of stars) if (Math.sin(time * 2 + tw * 10) > -0.5) wg.fillRect(Math.round(x), Math.round(y), 1, 1); }
    wg.drawImage(b.hills1, 0, 0); wg.drawImage(b.hills2, 0, 0); wg.drawImage(b.treeline, 0, 0); wg.drawImage(b.treeline2, 0, 0);
    // ground
    wg.fillStyle = '#4f8a3a'; wg.fillRect(0, gy, w, 6); wg.fillStyle = '#3f6e30'; wg.fillRect(0, gy + 6, w, 4); wg.fillStyle = '#5a3a22'; wg.fillRect(0, gy + 10, w, h - gy - 10);
    for (let x = 0; x < w; x += 7) { const hh = L.hash(x, 1, 3); wg.fillStyle = '#5c9a44'; wg.fillRect(x + Math.floor(hh * 4), gy - 2 - Math.floor(hh * 2), 1, 2 + Math.floor(hh * 2)); }
    // mill
    if (S.up.mill) { wg.drawImage(A.mill(), w - 58, gy - 38); wg.save(); wg.translate(w - 24, gy - 14); wg.rotate(bladeAngle); wg.drawImage(A.blade(0), -8, -8); wg.restore(); }
    // wagon
    if (S.up.merchant) { let wx = 6; if (wagonAnim >= 0) { const t = wagonAnim / 2.6; wx = 6 + easeInCubic(Math.min(1, t * 1.2)) * (w + 60); } wg.drawImage(A.wagon(), Math.round(wx), gy - 22); }
    // wood pile
    const level = S.logs + S.planks > 0 ? Math.min(5, Math.ceil(Math.log10(S.logs + S.planks + 1) * 1.6)) : 0;
    if (level > 0) wg.drawImage(A.pile(level), Math.round(w / 2) - 92, gy - 22);
    // tree / stump / sapling
    const cx = Math.round(w / 2);
    const tcv = A.tree(T.species, T.seed);
    if (T.state === 'up') {
      wg.save(); wg.translate(cx, gy); wg.rotate(Math.sin(time * 40) * 0.04 * wobble); wg.drawImage(tcv, -tcv.baseX, -tcv.baseY); wg.restore();
    } else if (T.state === 'falling') {
      const t = T.t; const ang = easeInCubic(Math.min(1, t / 0.86)) * Math.PI / 2 * fallDir; const alpha = t > 0.86 ? 1 - (t - 0.86) / 0.14 : 1;
      wg.drawImage(A.stump(T.species), cx - A.stump(T.species).width / 2, gy - 8);
      wg.save(); wg.globalAlpha = alpha; wg.translate(cx, gy - 4); wg.rotate(ang); wg.drawImage(tcv, -tcv.baseX, -tcv.baseY + 4); wg.restore();
    } else {
      const stage = clamp(Math.floor((T.t / G.d.regrow) * 4), 0, 3);

    }

    wg.drawImage(pl, px - 8, gy - 20); if (T.state === 'up') wg.drawImage(A.axe(playerSwing > 0 ? 2 : 1), px + (playerSwing > 0 ? 6 : 2), gy - (playerSwing > 0 ? 14 : 26));
    const slots = [1, -1, 1, -1, 1, -1]; const nCrew = Math.min(6, S.up.hire);
    for (let i = 0; i < nCrew; i++) {
      const c = crew[i], side = slots[i], dist = 14 + Math.round(tcv.width * 0.12) + 13 * Math.floor(i / 2) + (side < 0 ? 26 : 0), x = cx + side * dist, dir = side > 0 ? 1 : 2;
      const ph = (time * c.speed + c.phase) % 1, fr = T.state === 'up' ? (ph < 0.22 ? 2 : 1) : 0;
      wg.save(); if (dir === 1) { wg.translate(x * 2, 0); wg.scale(-1, 1); }
      wg.drawImage(A.human(A.CREW[i % A.CREW.length], 2, fr), x - 8, gy - 20); if (fr) wg.drawImage(A.axe(fr), x + (fr === 2 ? 6 : 2), gy - (fr === 2 ? 14 : 26));
      wg.restore();
    }
    if (S.up.hire > 6) { wg.fillStyle = 'rgba(0,0,0,0.35)'; wg.fillRect(cx + 60, gy - 30, 22, 9); wg.fillStyle = '#fff'; wg.font = '7px monospace'; wg.textBaseline = 'top'; wg.fillText('+' + (S.up.hire - 6), cx + 62, gy - 29); }
    // particles
    for (const pt of particles) { wg.globalAlpha = Math.max(0, 1 - pt.t / pt.life); wg.fillStyle = pt.c; wg.fillRect(Math.round(pt.x), Math.round(pt.y), pt.s, pt.s); } wg.globalAlpha = 1;
    // night tint + fireflies + lanterns
    if (night > 0.02) { wg.fillStyle = `rgba(10,16,40,${0.42 * night})`; wg.fillRect(0, 0, w, h); wg.globalCompositeOperation = 'lighter'; for (const f of fireflies) { const bl = 0.5 + 0.5 * Math.sin(time * f.sp * 3 + f.ph); if (bl < 0.3) continue; wg.fillStyle = `rgba(200,255,120,${bl * night})`; wg.fillRect(Math.round(f.x + Math.sin(time * f.sp + f.ph) * 8), Math.round(f.y + Math.cos(time * f.sp * 0.7) * 4), 1, 1); } const lg = wg.createRadialGradient(cx - 22, gy - 10, 0, cx - 22, gy - 10, 40); lg.addColorStop(0, `rgba(255,190,90,${0.35 * night})`); lg.addColorStop(1, 'rgba(255,190,90,0)'); wg.fillStyle = lg; wg.fillRect(cx - 62, gy - 50, 80, 60); wg.globalCompositeOperation = 'source-over'; }

    g.drawImage(sceneCv, 0, 0, w, h, Math.round(sc.x * dpr + shx), Math.round(sc.y * dpr + shy), Math.round(w * scale * dpr), Math.round(h * scale * dpr));
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    UI.draw(g, dt);
  }

})();
